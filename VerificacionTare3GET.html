<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Datos (GET)</title>
</head>
<body>
    <h1>Verificación de Datos - Método GET</h1>
    <hr>

    <script>
        // Obtener los parámetros de la URL
        const params = new URLSearchParams(window.location.search);

        // Crear una tabla para mostrar los resultados
        document.write("<table border='1' cellpadding='8'>");
        document.write("<tr><th>Campo</th><th>Valor ingresado</th></tr>");

        for (const [key, value] of params.entries()) {
            document.write("<tr><td>" + key + "</td><td>" + value + "</td></tr>");
        }

        document.write("</table>");
    </script>

    <p><a href="Tarea3GET.html">⬅️ Volver al formulario</a></p>
</body>
</html>
